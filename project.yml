# Generate the Xcode project with XcodeGen:
#   brew install xcodegen && xcodegen
# Then open Lexia.xcodeproj, choose your team, and run the "Lexia" scheme.
#
# Before running on a device, change the identifiers below to ones your team
# owns: the bundle ID prefix, App Group and Keychain group must match in both
# targets.
name: Lexia

options:
  bundleIdPrefix: app.lexia
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""                # ← your Apple team ID
    LEXIA_APP_GROUP: group.app.lexia
    LEXIA_KEYCHAIN_GROUP: $(AppIdentifierPrefix)app.lexia.shared
    TARGETED_DEVICE_FAMILY: "1,2"

packages:
  LexiaCore:
    path: LexiaCore

targets:
  Lexia:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - path: Fonts
        buildPhase: resources
    dependencies:
      - package: LexiaCore
      - target: LexiaKeyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lexia
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Lexia
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - OpenDyslexic-Regular.otf
          - OpenDyslexic-Bold.otf
        LexiaAppGroup: $(LEXIA_APP_GROUP)
        LexiaKeychainGroup: $(LEXIA_KEYCHAIN_GROUP)
    entitlements:
      path: App/Lexia.entitlements
      properties:
        com.apple.security.application-groups:
          - $(LEXIA_APP_GROUP)
        keychain-access-groups:
          - $(LEXIA_KEYCHAIN_GROUP)

  LexiaKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
      - Shared
      - path: Fonts
        buildPhase: resources
    dependencies:
      - package: LexiaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lexia.keyboard
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Lexia
        UIAppFonts:
          - OpenDyslexic-Regular.otf
          - OpenDyslexic-Bold.otf
        LexiaAppGroup: $(LEXIA_APP_GROUP)
        LexiaKeychainGroup: $(LEXIA_KEYCHAIN_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            # Needed to reach Jev and to share settings with the app.
            RequestsOpenAccess: true
    entitlements:
      path: Keyboard/LexiaKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - $(LEXIA_APP_GROUP)
        keychain-access-groups:
          - $(LEXIA_KEYCHAIN_GROUP)

schemes:
  Lexia:
    build:
      targets:
        Lexia: all
        LexiaKeyboard: all
    run:
      config: Debug
