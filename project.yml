# XcodeGen spec. Lexia.xcodeproj is generated from this file and committed,
# so you only need XcodeGen (brew install xcodegen && xcodegen) if you change
# this file.
#
# If Xcode says the bundle identifier is unavailable, change
# LEXIA_BUNDLE_PREFIX below (or in Xcode: project ▸ Build Settings) to
# something unique like com.yourname.lexia.
name: Lexia

options:
  bundleIdPrefix: io.github.ashleyjellis7
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""                # ← chosen in Xcode under Signing & Capabilities
    CODE_SIGN_STYLE: Automatic
    LEXIA_BUNDLE_PREFIX: io.github.ashleyjellis7.lexia
    LEXIA_KEYCHAIN_GROUP: $(AppIdentifierPrefix)$(LEXIA_BUNDLE_PREFIX).shared
    TARGETED_DEVICE_FAMILY: "1,2"

packages:
  LexiaCore:
    path: LexiaCore

targets:
  Lexia:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - path: Fonts
        buildPhase: resources
    dependencies:
      - package: LexiaCore
      - target: LexiaKeyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LEXIA_BUNDLE_PREFIX)
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Lexia
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - OpenDyslexic-Regular.otf
          - OpenDyslexic-Bold.otf
        LexiaKeychainGroup: $(LEXIA_KEYCHAIN_GROUP)
    entitlements:
      path: App/Lexia.entitlements
      properties:
        keychain-access-groups:
          - $(LEXIA_KEYCHAIN_GROUP)

  LexiaKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
      - Shared
      - path: Fonts
        buildPhase: resources
    dependencies:
      - package: LexiaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LEXIA_BUNDLE_PREFIX).keyboard
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Lexia
        UIAppFonts:
          - OpenDyslexic-Regular.otf
          - OpenDyslexic-Bold.otf
        LexiaKeychainGroup: $(LEXIA_KEYCHAIN_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            # Needed to reach Jev.
            RequestsOpenAccess: true
    entitlements:
      path: Keyboard/LexiaKeyboard.entitlements
      properties:
        keychain-access-groups:
          - $(LEXIA_KEYCHAIN_GROUP)

schemes:
  Lexia:
    build:
      targets:
        Lexia: all
        LexiaKeyboard: all
    run:
      config: Debug
