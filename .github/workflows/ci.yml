name: CI

on:
  push:
  pull_request:

jobs:
  core-tests:
    name: LexiaCore tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        working-directory: LexiaCore
        run: swift test

  ios-build:
    name: Build app + keyboard
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Lexia.xcodeproj \
            -scheme Lexia \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | tail -n 200
